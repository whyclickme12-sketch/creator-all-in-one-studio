<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 미리보기 · 올인원 유튜브 스튜디오</title>
<style>
  html, body { margin: 0; background: #14171c; color: #8e9aab;
    font: 12px/1.5 -apple-system, "Malgun Gothic", sans-serif; }
  .wrap { display: flex; justify-content: center; padding: 8px 0; }
  .phone { background: #0b0d10; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #2a313b, 0 10px 40px rgba(0,0,0,.5); }
  .cap { padding: 6px 10px; letter-spacing: .04em; }
  iframe { display: block; width: 390px; height: 740px; border: 0; background: #0b0d10; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="cap" id="cap">390 × 740</div>
    <iframe id="frame" src="../index.html#analyzer" title="모바일 미리보기"></iframe>
  </div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var tab = params.get('tab') || 'analyzer';
  var w = params.get('w') || 390;
  var h = params.get('h') || 740;
  var frame = document.getElementById('frame');
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.src = '../index.html?v=' + Date.now() + '#' + tab;
  document.getElementById('cap').textContent = w + ' × ' + h + ' · ' + tab;
</script>
</body>
</html>
